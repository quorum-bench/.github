<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="titulo desc" font-family="'Source Sans 3', 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
<title id="titulo">Os repositórios do Bench</title><desc id="desc">O banco, os pacotes e o design-system publicam os pacotes que os serviços usam. A web e o console usam o banco e o design-system; a api, o worker e a midia usam o banco e os pacotes. O aplicativo fala só com a api. A infra sobe todos no ambiente local e na nuvem. A documentação de decisões, requisitos e arquitetura fica no repositório docs.</desc>
<defs><marker id="ponta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9aa7b2"/></marker><marker id="pontaMarca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6fd9d2"/></marker></defs>
<rect width="1600" height="960" fill="#0d1117"/>
<text x="40" y="54" font-family="'Squada One', 'Arial Narrow', Impact, sans-serif" font-size="34" fill="#e6edf3">BENCH<tspan fill="#3ac5bd">.</tspan></text>
<text x="172" y="52" font-size="22" font-weight="600" fill="#e6edf3">Os repositórios do Bench</text>
<text x="172" y="76" font-size="15" fill="#9aa7b2">Três pacotes publicados, cinco serviços, o aplicativo, a infraestrutura e a documentação</text>
