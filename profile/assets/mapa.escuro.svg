<text x="800.0" y="630.5" font-size="13" text-anchor="middle" fill="#9aa7b2">/v1</text>
<rect x="70" y="160" width="330" height="130" rx="12" fill="#3ac5bd" stroke="#3ac5bd" stroke-width="0"/>
<text x="235" y="213" font-size="17" font-weight="700" text-anchor="middle" fill="#0f1a1a">banco</text>
<text x="235" y="235" font-size="13.5" text-anchor="middle" fill="#0f1a1a">@quorum-bench/db: migrações, funções</text>
<text x="235" y="253" font-size="13.5" text-anchor="middle" fill="#0f1a1a">api.* e segurança por linha</text>
<rect x="440" y="160" width="330" height="130" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
<text x="605" y="213" font-size="17" font-weight="700" text-anchor="middle" fill="#e6edf3">pacotes</text>
<text x="605" y="235" font-size="13.5" text-anchor="middle" fill="#9aa7b2">Domínio, contratos da /v1, portas,</text>
<text x="605" y="253" font-size="13.5" text-anchor="middle" fill="#9aa7b2">servidor e a guarda</text>
<rect x="810" y="160" width="350" height="130" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
<text x="985" y="213" font-size="17" font-weight="700" text-anchor="middle" fill="#e6edf3">design-system</text>
<text x="985" y="235" font-size="13.5" text-anchor="middle" fill="#9aa7b2">@quorum-bench/ui e ui-app: tokens e</text>
<text x="985" y="253" font-size="13.5" text-anchor="middle" fill="#9aa7b2">componentes BENCH</text>
<rect x="1230" y="160" width="330" height="130" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="1395" y="213" font-size="17" font-weight="700" text-anchor="middle" fill="#e6edf3">docs</text>
<text x="1395" y="235" font-size="13.5" text-anchor="middle" fill="#9aa7b2">Decisões, requisitos, arquitetura, plano</text>
<text x="1395" y="253" font-size="13.5" text-anchor="middle" fill="#9aa7b2">e operação</text>
<rect x="70" y="430" width="260" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
<text x="200" y="478" font-size="17" font-weight="700" text-anchor="middle" fill="#e6edf3">web</text>
<text x="200" y="500" font-size="13.5" text-anchor="middle" fill="#9aa7b2">A vitrine e o painel do</text>
<text x="200" y="518" font-size="13.5" text-anchor="middle" fill="#9aa7b2">fornecedor</text>
<rect x="370" y="430" width="260" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
<text x="500" y="478" font-size="17" font-weight="700" text-anchor="middle" fill="#e6edf3">console</text>
<text x="500" y="500" font-size="13.5" text-anchor="middle" fill="#9aa7b2">Moderação, casos, contas e</text>
<text x="500" y="518" font-size="13.5" text-anchor="middle" fill="#9aa7b2">equipe</text>
<rect x="670" y="430" width="260" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
<text x="800" y="478" font-size="17" font-weight="700" text-anchor="middle" fill="#e6edf3">api</text>
<text x="800" y="500" font-size="13.5" text-anchor="middle" fill="#9aa7b2">A /v1 do aplicativo e das</text>
<text x="800" y="518" font-size="13.5" text-anchor="middle" fill="#9aa7b2">integrações</text>
<rect x="970" y="430" width="260" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
<text x="1100" y="478" font-size="17" font-weight="700" text-anchor="middle" fill="#e6edf3">worker</text>
<text x="1100" y="500" font-size="13.5" text-anchor="middle" fill="#9aa7b2">Caixa de saída, agenda e</text>
<text x="1100" y="518" font-size="13.5" text-anchor="middle" fill="#9aa7b2">expurgos</text>
<rect x="1270" y="430" width="260" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
<text x="1400" y="487" font-size="17" font-weight="700" text-anchor="middle" fill="#e6edf3">midia</text>
<text x="1400" y="509" font-size="13.5" text-anchor="middle" fill="#9aa7b2">A limpeza de imagem e PDF</text>
<rect x="670" y="700" width="260" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
<text x="800" y="748" font-size="17" font-weight="700" text-anchor="middle" fill="#e6edf3">app-movel</text>
<text x="800" y="770" font-size="13.5" text-anchor="middle" fill="#9aa7b2">O aplicativo, que fala só com a</text>
<text x="800" y="788" font-size="13.5" text-anchor="middle" fill="#9aa7b2">api</text>
<rect x="1070" y="700" width="460" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.4"/>
<text x="1300" y="757" font-size="17" font-weight="700" text-anchor="middle" fill="#e6edf3">infra</text>
<text x="1300" y="779" font-size="13.5" text-anchor="middle" fill="#9aa7b2">Terraform da nuvem e o ambiente local em contêineres</text>
<rect x="70" y="700" width="260" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="200" y="757" font-size="17" font-weight="700" text-anchor="middle" fill="#e6edf3">.github</text>
<text x="200" y="779" font-size="13.5" text-anchor="middle" fill="#9aa7b2">Este perfil público</text>
<text x="40" y="936" font-size="13" fill="#9aa7b2">As setas mostram de quem cada serviço depende. Todo serviço usa também o @quorum-bench/db e a guarda; o desenho mostra só a dependência principal.</text>
</svg>
