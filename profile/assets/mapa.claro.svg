<text x="985" y="213" font-size="17" font-weight="700" text-anchor="middle" fill="#0f1a1a">design-system</text>
<text x="985" y="235" font-size="13.5" text-anchor="middle" fill="#4a5a5a">@quorum-bench/ui e ui-app: tokens e</text>
<text x="985" y="253" font-size="13.5" text-anchor="middle" fill="#4a5a5a">componentes BENCH</text>
<rect x="1230" y="160" width="330" height="130" rx="12" fill="#f4f7f7" stroke="#c9d3d3" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="1395" y="213" font-size="17" font-weight="700" text-anchor="middle" fill="#0f1a1a">docs</text>
<text x="1395" y="235" font-size="13.5" text-anchor="middle" fill="#4a5a5a">Decisões, requisitos, arquitetura, plano</text>
<text x="1395" y="253" font-size="13.5" text-anchor="middle" fill="#4a5a5a">e operação</text>
<rect x="70" y="430" width="260" height="120" rx="12" fill="#f4f7f7" stroke="#c9d3d3" stroke-width="1.4"/>
<text x="200" y="478" font-size="17" font-weight="700" text-anchor="middle" fill="#0f1a1a">web</text>
<text x="200" y="500" font-size="13.5" text-anchor="middle" fill="#4a5a5a">A vitrine e o painel do</text>
<text x="200" y="518" font-size="13.5" text-anchor="middle" fill="#4a5a5a">fornecedor</text>
<rect x="370" y="430" width="260" height="120" rx="12" fill="#f4f7f7" stroke="#c9d3d3" stroke-width="1.4"/>
<text x="500" y="478" font-size="17" font-weight="700" text-anchor="middle" fill="#0f1a1a">console</text>
<text x="500" y="500" font-size="13.5" text-anchor="middle" fill="#4a5a5a">Moderação, casos, contas e</text>
<text x="500" y="518" font-size="13.5" text-anchor="middle" fill="#4a5a5a">equipe</text>
