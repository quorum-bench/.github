<text x="800" y="478" font-size="17" font-weight="700" text-anchor="middle" fill="#0f1a1a">api</text>
<text x="800" y="500" font-size="13.5" text-anchor="middle" fill="#4a5a5a">A /v1 do aplicativo e das</text>
<text x="800" y="518" font-size="13.5" text-anchor="middle" fill="#4a5a5a">integrações</text>
<rect x="970" y="430" width="260" height="120" rx="12" fill="#f4f7f7" stroke="#c9d3d3" stroke-width="1.4"/>
<text x="1100" y="478" font-size="17" font-weight="700" text-anchor="middle" fill="#0f1a1a">worker</text>
<text x="1100" y="500" font-size="13.5" text-anchor="middle" fill="#4a5a5a">Caixa de saída, agenda e</text>
<text x="1100" y="518" font-size="13.5" text-anchor="middle" fill="#4a5a5a">expurgos</text>
<rect x="1270" y="430" width="260" height="120" rx="12" fill="#f4f7f7" stroke="#c9d3d3" stroke-width="1.4"/>
<text x="1400" y="487" font-size="17" font-weight="700" text-anchor="middle" fill="#0f1a1a">midia</text>
<text x="1400" y="509" font-size="13.5" text-anchor="middle" fill="#4a5a5a">A limpeza de imagem e PDF</text>
<rect x="670" y="700" width="260" height="120" rx="12" fill="#f4f7f7" stroke="#c9d3d3" stroke-width="1.4"/>
<text x="800" y="748" font-size="17" font-weight="700" text-anchor="middle" fill="#0f1a1a">app-movel</text>
<text x="800" y="770" font-size="13.5" text-anchor="middle" fill="#4a5a5a">O aplicativo, que fala só com a</text>
<text x="800" y="788" font-size="13.5" text-anchor="middle" fill="#4a5a5a">api</text>
<rect x="1070" y="700" width="460" height="120" rx="12" fill="#f4f7f7" stroke="#c9d3d3" stroke-width="1.4"/>
<text x="1300" y="757" font-size="17" font-weight="700" text-anchor="middle" fill="#0f1a1a">infra</text>
<text x="1300" y="779" font-size="13.5" text-anchor="middle" fill="#4a5a5a">Terraform da nuvem e o ambiente local em contêineres</text>
<rect x="70" y="700" width="260" height="120" rx="12" fill="#f4f7f7" stroke="#c9d3d3" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="200" y="757" font-size="17" font-weight="700" text-anchor="middle" fill="#0f1a1a">.github</text>
<text x="200" y="779" font-size="13.5" text-anchor="middle" fill="#4a5a5a">Este perfil público</text>
<text x="40" y="936" font-size="13" fill="#4a5a5a">As setas mostram de quem cada serviço depende. Todo serviço usa também o @quorum-bench/db e a guarda; o desenho mostra só a dependência principal.</text>
