<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="titulo desc" font-family="'Source Sans 3', 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
<title id="titulo">Os repositórios do Bench</title><desc id="desc">Os serviços web, console, api, worker e midia usam os três pacotes: banco, pacotes e design-system. O aplicativo fala só com a api, pela /v1. A infra sobe e publica os serviços. A documentação e o perfil da organização ficam num grupo próprio.</desc>
<defs><marker id="ponta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4a5a5a"/></marker><marker id="pontaMarca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1f6a66"/></marker></defs>
<rect width="1600" height="1000" fill="#ffffff"/>
<text x="40" y="54" font-family="'Squada One', 'Arial Narrow', Impact, sans-serif" font-size="34" fill="#0f1a1a">BENCH<tspan fill="#3ac5bd">.</tspan></text>
<text x="172" y="52" font-size="22" font-weight="600" fill="#0f1a1a">Os repositórios do Bench</text>
<text x="172" y="76" font-size="15" fill="#4a5a5a">Três pacotes, cinco serviços, o aplicativo, a infraestrutura e a documentação</text>
<rect x="40" y="110" width="1520" height="200" rx="14" fill="none" stroke="#8aa3a2" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="56" y="134" font-size="13" font-weight="700" letter-spacing="1.2" fill="#4a5a5a">PACOTES</text>
<rect x="40" y="400" width="1520" height="200" rx="14" fill="none" stroke="#8aa3a2" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="56" y="424" font-size="13" font-weight="700" letter-spacing="1.2" fill="#4a5a5a">SERVIÇOS</text>
<rect x="40" y="690" width="1000" height="220" rx="14" fill="none" stroke="#8aa3a2" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="56" y="714" font-size="13" font-weight="700" letter-spacing="1.2" fill="#4a5a5a">APLICATIVO E INFRAESTRUTURA</text>
<rect x="1080" y="690" width="480" height="220" rx="14" fill="none" stroke="#8aa3a2" stroke-width="1.5" stroke-dasharray="7 6"/>
<text x="1096" y="714" font-size="13" font-weight="700" letter-spacing="1.2" fill="#4a5a5a">DOCUMENTAÇÃO E ORGANIZAÇÃO</text>
<path d="M800 400 L800 310" fill="none" stroke="#1f6a66" stroke-width="2.4" marker-end="url(#pontaMarca)"/>
<rect x="707.8" y="334.0" width="184.4" height="42" rx="6" fill="#ffffff" opacity="0.94"/>
<text x="800" y="352.0" font-size="13" text-anchor="middle" fill="#4a5a5a">todo serviço usa os três</text>
<text x="800" y="369.0" font-size="13" text-anchor="middle" fill="#4a5a5a">pacotes</text>
<path d="M805 750 L805 570" fill="none" stroke="#1f6a66" stroke-width="2.4" marker-end="url(#pontaMarca)"/>
<rect x="787.4" y="637.5" width="35.3" height="25" rx="6" fill="#ffffff" opacity="0.94"/>
<text x="805" y="655.5" font-size="13" text-anchor="middle" fill="#4a5a5a">/v1</text>
<path d="M400 750 L400 600" fill="none" stroke="#4a5a5a" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#ponta)"/>
<rect x="300.7" y="647.5" width="198.6" height="25" rx="6" fill="#ffffff" opacity="0.94"/>
<text x="400" y="665.5" font-size="13" text-anchor="middle" fill="#4a5a5a">sobe e publica os serviços</text>
<rect x="70" y="155" width="460" height="125" rx="12" fill="#3ac5bd" stroke="#3ac5bd" stroke-width="0"/>
<text x="300" y="205.5" font-size="17" font-weight="700" text-anchor="middle" fill="#0f1a1a">banco</text>
<text x="300" y="227.5" font-size="13.5" text-anchor="middle" fill="#0f1a1a">@quorum-bench/db: migrações, funções api.* e segurança por</text>
<text x="300" y="245.5" font-size="13.5" text-anchor="middle" fill="#0f1a1a">linha</text>
<rect x="570" y="155" width="460" height="125" rx="12" fill="#f4f7f7" stroke="#c9d3d3" stroke-width="1.4"/>
<text x="800" y="214.5" font-size="17" font-weight="700" text-anchor="middle" fill="#0f1a1a">pacotes</text>
<text x="800" y="236.5" font-size="13.5" text-anchor="middle" fill="#4a5a5a">Domínio, contratos da /v1, portas, servidor e a guarda</text>
<rect x="1070" y="155" width="460" height="125" rx="12" fill="#f4f7f7" stroke="#c9d3d3" stroke-width="1.4"/>
<text x="1300" y="214.5" font-size="17" font-weight="700" text-anchor="middle" fill="#0f1a1a">design-system</text>
<text x="1300" y="236.5" font-size="13.5" text-anchor="middle" fill="#4a5a5a">@quorum-bench/ui e ui-app: tokens e componentes BENCH</text>
<rect x="70" y="450" width="270" height="120" rx="12" fill="#f4f7f7" stroke="#c9d3d3" stroke-width="1.4"/>
<text x="205" y="498" font-size="17" font-weight="700" text-anchor="middle" fill="#0f1a1a">web</text>
<text x="205" y="520" font-size="13.5" text-anchor="middle" fill="#4a5a5a">A vitrine e o painel do</text>
<text x="205" y="538" font-size="13.5" text-anchor="middle" fill="#4a5a5a">fornecedor</text>
<rect x="370" y="450" width="270" height="120" rx="12" fill="#f4f7f7" stroke="#c9d3d3" stroke-width="1.4"/>
<text x="505" y="507" font-size="17" font-weight="700" text-anchor="middle" fill="#0f1a1a">console</text>
<text x="505" y="529" font-size="13.5" text-anchor="middle" fill="#4a5a5a">Moderação, casos, contas e equipe</text>
<rect x="670" y="450" width="270" height="120" rx="12" fill="#f4f7f7" stroke="#c9d3d3" stroke-width="1.4"/>
<text x="805" y="498" font-size="17" font-weight="700" text-anchor="middle" fill="#0f1a1a">api</text>
<text x="805" y="520" font-size="13.5" text-anchor="middle" fill="#4a5a5a">A /v1 do aplicativo e das</text>
<text x="805" y="538" font-size="13.5" text-anchor="middle" fill="#4a5a5a">integrações</text>
<rect x="970" y="450" width="270" height="120" rx="12" fill="#f4f7f7" stroke="#c9d3d3" stroke-width="1.4"/>
<text x="1105" y="507" font-size="17" font-weight="700" text-anchor="middle" fill="#0f1a1a">worker</text>
<text x="1105" y="529" font-size="13.5" text-anchor="middle" fill="#4a5a5a">Caixa de saída, agenda e expurgos</text>
<rect x="1270" y="450" width="260" height="120" rx="12" fill="#f4f7f7" stroke="#c9d3d3" stroke-width="1.4"/>
<text x="1400" y="507" font-size="17" font-weight="700" text-anchor="middle" fill="#0f1a1a">midia</text>
<text x="1400" y="529" font-size="13.5" text-anchor="middle" fill="#4a5a5a">A limpeza de imagem e PDF</text>
<rect x="670" y="750" width="270" height="120" rx="12" fill="#f4f7f7" stroke="#c9d3d3" stroke-width="1.4"/>
<text x="805" y="798" font-size="17" font-weight="700" text-anchor="middle" fill="#0f1a1a">app-movel</text>
<text x="805" y="820" font-size="13.5" text-anchor="middle" fill="#4a5a5a">O aplicativo, que fala só com a</text>
<text x="805" y="838" font-size="13.5" text-anchor="middle" fill="#4a5a5a">api</text>
<rect x="70" y="750" width="400" height="120" rx="12" fill="#f4f7f7" stroke="#c9d3d3" stroke-width="1.4"/>
<text x="270" y="807" font-size="17" font-weight="700" text-anchor="middle" fill="#0f1a1a">infra</text>
<text x="270" y="829" font-size="13.5" text-anchor="middle" fill="#4a5a5a">Terraform da nuvem e o ambiente local</text>
<rect x="1110" y="750" width="240" height="120" rx="12" fill="#f4f7f7" stroke="#c9d3d3" stroke-width="1.4"/>
<text x="1230" y="798" font-size="17" font-weight="700" text-anchor="middle" fill="#0f1a1a">docs</text>
<text x="1230" y="820" font-size="13.5" text-anchor="middle" fill="#4a5a5a">Decisões, requisitos,</text>
<text x="1230" y="838" font-size="13.5" text-anchor="middle" fill="#4a5a5a">arquitetura, plano e operação</text>
<rect x="1370" y="750" width="170" height="120" rx="12" fill="#f4f7f7" stroke="#c9d3d3" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="1455" y="807" font-size="17" font-weight="700" text-anchor="middle" fill="#0f1a1a">.github</text>
<text x="1455" y="829" font-size="13.5" text-anchor="middle" fill="#4a5a5a">O perfil público</text>
<text x="40" y="976" font-size="13" fill="#4a5a5a">Seta cheia: depende de. Seta tracejada: sobe e publica. A seta entre os grupos vale para todos os serviços do grupo.</text>
</svg>
