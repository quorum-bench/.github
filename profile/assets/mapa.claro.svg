<text x="605" y="213" font-size="17" font-weight="700" text-anchor="middle" fill="#0f1a1a">pacotes</text>
<text x="605" y="235" font-size="13.5" text-anchor="middle" fill="#4a5a5a">Domínio, contratos da /v1, portas,</text>
<text x="605" y="253" font-size="13.5" text-anchor="middle" fill="#4a5a5a">servidor e a guarda</text>
